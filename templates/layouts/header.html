{{ define "header" }}

<!DOCTYPE html>
<html>
  <head>
    <title>Fluxion Dashboard</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-slate-100">
    <div class="min-h-screen">
      <nav class="bg-blue-600 shadow-md">
        <div
          class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"
        >
          <a href="/" class="text-white text-2xl font-bold tracking-wide">
            Fluxion Dashboard
          </a>

          <div class="flex items-center gap-3">
            <a
              href="/logs"
              class="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium hover:bg-gray-100 transition"
            >
              📚 Logs
            </a>

            <span class="text-white font-semibold"> Admin Logged In </span>

            <a
              href="/logout"
              class="bg-white text-red-600 px-4 py-2 rounded-lg font-medium hover:bg-red-50 transition"
            >
              Logout
            </a>
          </div>
        </div>
      </nav>

      {{ end }}
    </div>
  </body>
</html>
