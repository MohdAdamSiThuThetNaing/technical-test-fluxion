{{ template "header" . }}

<div class="min-h-screen bg-slate-100 py-10">
  <div class="max-w-3xl mx-auto px-4">
    <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
      <div class="p-8 border-b border-slate-200 text-center">
        <div
          class="w-20 h-20 mx-auto rounded-3xl bg-amber-100 flex items-center justify-center text-4xl mb-5"
        >
          ✏️
        </div>

        <h1 class="text-4xl font-extrabold text-slate-900 mb-3">Edit User</h1>

        <p class="text-slate-500 text-lg">Update user account information</p>
      </div>

      {{ if .Error }}

      <div class="px-8 pt-8">
        <div
          class="flex items-center gap-3 rounded-2xl bg-red-100 border border-red-200 px-5 py-4 text-red-700 font-medium"
        >
          ⚠️ {{ .Error }}
        </div>
      </div>

      {{ end }}

      <div class="p-8">
        <form
          method="POST"
          action="/users/edit/{{ .User.ID }}"
          class="space-y-6"
        >
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-3">
              Full Name
            </label>

            <input
              type="text"
              name="name"
              value="{{ .User.Name }}"
              required
              class="w-full rounded-2xl border border-slate-300 bg-white px-5 py-4 text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-3">
              Email Address
            </label>

            <input
              type="email"
              name="email"
              value="{{ .User.Email }}"
              required
              class="w-full rounded-2xl border border-slate-300 bg-white px-5 py-4 text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />
          </div>

          <div class="flex flex-col sm:flex-row gap-4 pt-4">
            <button
              type="submit"
              class="inline-flex items-center justify-center px-6 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 transition text-white font-semibold shadow-sm"
            >
              Update User
            </button>

            <a
              href="/users"
              class="inline-flex items-center justify-center px-6 py-4 rounded-2xl bg-slate-200 hover:bg-slate-300 transition text-slate-700 font-semibold"
            >
              Back to Users
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{{ template "footer" . }}
