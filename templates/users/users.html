{{ template "header" . }}

<style>
  .table thead th {
    background: #f1f5f9;
  }

  .user-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #206bc4;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
</style>

<div class="container-xl mt-5">
  <div class="card page-card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="mb-1">👥 Users Management</h1>

          <p class="text-secondary mb-0">
            Manage application users and CRUD operations
          </p>
        </div>

        <a href="/users/create" class="btn btn-primary btn-lg"> Create User </a>
      </div>

      <div class="table-responsive">
        <table class="table table-vcenter table-hover card-table">
          <thead>
            <tr>
              <th>User</th>

              <th>Email</th>

              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            {{ range .Users }}

            <tr>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <div class="user-avatar">{{ slice .Name 0 1 }}</div>

                  <div>
                    <div class="fw-bold">{{ .Name }}</div>

                    <div class="text-secondary">User Account</div>
                  </div>
                </div>
              </td>

              <td>{{ .Email }}</td>

              <td class="text-end">
                <a href="/users/edit/{{ .ID }}" class="btn btn-warning btn-sm">
                  Edit
                </a>

                <form
                  action="/users/delete/{{ .ID }}"
                  method="POST"
                  style="display: inline"
                >
                  <button
                    type="submit"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Are you sure you want to delete this user?')"
                  >
                    Delete
                  </button>
                </form>
              </td>
            </tr>

            {{ end }}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

{{ template "footer" . }}
