{{ template "header" . }}

<div class="min-h-screen bg-slate-100 py-10">
  <div class="max-w-7xl mx-auto px-4">
    <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
      <div
        class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 p-8 border-b border-slate-200"
      >
        <div>
          <h1 class="text-4xl font-extrabold text-slate-900 mb-2">
            👥 Users Management
          </h1>

          <p class="text-slate-500 text-lg">
            Manage application users and CRUD operations
          </p>
        </div>

        <a
          href="/users/create"
          class="inline-flex items-center justify-center px-6 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 transition text-white font-semibold shadow-sm"
        >
          Create User
        </a>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-slate-100 border-b border-slate-200">
            <tr>
              <th
                class="text-left px-6 py-5 text-sm font-bold tracking-wide text-slate-700 uppercase"
              >
                User
              </th>

              <th
                class="text-left px-6 py-5 text-sm font-bold tracking-wide text-slate-700 uppercase"
              >
                Email
              </th>

              <th
                class="text-right px-6 py-5 text-sm font-bold tracking-wide text-slate-700 uppercase"
              >
                Actions
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-slate-100 bg-white">
            {{ range .Users }}

            <tr class="hover:bg-slate-50 transition">
              <td class="px-6 py-5">
                <div class="flex items-center gap-4">
                  <div
                    class="w-11 h-11 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm"
                  >
                    {{ slice .Name 0 1 }}
                  </div>

                  <div>
                    <div class="font-bold text-slate-900">{{ .Name }}</div>

                    <div class="text-sm text-slate-500">User Account</div>
                  </div>
                </div>
              </td>

              <td class="px-6 py-5 text-slate-700 font-medium">{{ .Email }}</td>

              <td class="px-6 py-5">
                <div class="flex items-center justify-end gap-3">
                  <a
                    href="/users/edit/{{ .ID }}"
                    class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 transition text-amber-700 text-sm font-bold"
                  >
                    Edit
                  </a>

                  <form
                    action="/users/delete/{{ .ID }}"
                    method="POST"
                    class="inline"
                  >
                    <button
                      type="submit"
                      onclick="return confirm('Are you sure you want to delete this user?')"
                      class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-red-100 hover:bg-red-200 transition text-red-700 text-sm font-bold"
                    >
                      Delete
                    </button>
                  </form>
                </div>
              </td>
            </tr>

            {{ end }}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

{{ template "footer" . }}
