<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fluxion Admin Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div
          class="w-24 h-24 mx-auto rounded-3xl bg-blue-600 flex items-center justify-center text-white text-4xl font-bold shadow-lg mb-6"
        >
          ⚡
        </div>

        <h1 class="text-4xl font-extrabold text-slate-900 mb-3">
          Fluxion Admin
        </h1>

        <p class="text-slate-500 text-lg">Secure dashboard authentication</p>
      </div>

      <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="p-8">
          {{ if .Error }}

          <div
            class="flex items-center gap-3 rounded-2xl bg-red-100 border border-red-200 px-5 py-4 text-red-700 font-medium mb-6"
          >
            ⚠️ {{ .Error }}
          </div>

          {{ end }}

          <form method="POST" action="/login" class="space-y-6">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-3">
                Email Address
              </label>

              <input
                type="email"
                name="email"
                required
                placeholder="Enter email address"
                class="w-full rounded-2xl border border-slate-300 bg-white px-5 py-4 text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
              />
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-3">
                Password
              </label>

              <input
                type="password"
                name="password"
                required
                placeholder="Enter password"
                class="w-full rounded-2xl border border-slate-300 bg-white px-5 py-4 text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
              />
            </div>

            <button
              type="submit"
              class="w-full inline-flex items-center justify-center px-6 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 transition text-white font-semibold shadow-sm"
            >
              Login
            </button>
          </form>
        </div>
      </div>

      <div class="text-center mt-8 text-sm text-slate-500">
        © {{ currentYear }} Fluxion Dashboard. All rights reserved.
      </div>
    </div>
  </body>
</html>
